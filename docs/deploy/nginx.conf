# Communication layer (architecture diagram): every request in or out passes
# through Nginx. TLS on 443 only, static files served directly, /api and the
# pages handed to Laravel through PHP-FPM, 5 MB upload cap, rate limits,
# IP allowlist for internal tools, access logs.
#
# Sample for the EC2 host. Adjust server_name, certificate paths, the PHP-FPM
# socket and the allowlisted ranges before use.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name admission.plpasig.edu.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admission.plpasig.edu.ph;
    root /var/www/admission/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/admission.plpasig.edu.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admission.plpasig.edu.ph/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Matches ADMISSION_UPLOAD_MAX_KB (5 MB) with a little room for the form envelope
    client_max_body_size 6m;

    # Compress API JSON and assets (the office panel's state compresses ~10x)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    access_log /var/log/nginx/admission.access.log;
    error_log  /var/log/nginx/admission.error.log;

    # Static assets (CSS, JS, images) straight from disk
    location /assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Sign-in and registration: tighter limit
    location ~ ^/api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Laravel Pulse and Log Viewer (INT-06): office network / VPN only
    location ~ ^/(pulse|log-viewer) {
        allow 10.0.0.0/16;      # VPC / office VPN range: replace
        deny all;
        try_files $uri /index.php?$query_string;
    }

    # Partner systems calling us (Enrollment callback): their IPs only, plus the API key
    location /api/integrations/ {
        allow 10.0.0.0/16;      # replace with the partner systems' addresses
        deny all;
        try_files $uri /index.php?$query_string;
    }

    # Health check for UptimeRobot / a load balancer
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles (.env and the like)
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# Outbound calls to the Document Management System also go through this layer
# (paper §7.2). Point DMS_BASE_URL at http://127.0.0.1:8081/dms so the DMS sees
# one allowlisted IP (the EC2 Elastic IP). The OAS never calls Enrollment (D12).
server {
    listen 127.0.0.1:8081;
    location /dms/ {
        proxy_pass https://dms.plpasig.edu.ph/;   # replace with the DMS API base URL
        proxy_set_header Host dms.plpasig.edu.ph;
        proxy_ssl_server_name on;
        access_log /var/log/nginx/admission.outbound.log;
    }
}
