name: tests

on:
  push:
    branches: [backend, main]
  pull_request:
  workflow_call:        # deploy.yml runs these first

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MySQL is the production database (RDS); it enforces column lengths,
        # name limits and trigger rules that SQLite ignores.
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admission_system
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, fileinfo, mbstring
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && php artisan jwt:secret --force
      - name: Run tests on ${{ matrix.database }}
        run: |
          if [ "${{ matrix.database }}" = "mysql" ]; then
            export DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=admission_system DB_USERNAME=root DB_PASSWORD=root
          fi
          php artisan test
